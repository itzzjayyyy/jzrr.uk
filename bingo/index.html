<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo Caller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* classic is the base look; other themes override variables and add scenery */
:root{
  --page:#f2f2f0;--ink:#111;--muted:#707070;--line:#d2d2d2;--panel:#fff;--panel-line:#e0e0e0;
  --cell:#fff;--accent:#111;--accent-ink:#fff;--btn:#111;--btn-ink:#fff;
  --lit1:#111;--lit2:#111;--lit3:#111;--ring:#111;--face:#fff;--face-ink:#111;
  --font:'Bricolage Grotesque',system-ui,sans-serif;
}
[data-theme=christmas]{--page:#0c2a1f;--ink:#f4ead3;--muted:#b3a88c;--line:rgba(217,180,90,.28);--panel:rgba(8,30,22,.88);--panel-line:rgba(217,180,90,.35);
  --cell:rgba(0,0,0,.18);--accent:#d9a93a;--accent-ink:#231700;--btn:#d9a93a;--btn-ink:#231700;
  --lit1:#c8323d;--lit2:#1f8a5b;--lit3:#d9a93a;--ring:#c8323d;--face:#f7efdc;--face-ink:#1a120a}
[data-theme=seaside]{--page:#cfe8ef;--ink:#0f2d3a;--muted:#4b6b76;--line:#b4d2d9;--panel:rgba(255,252,244,.9);--panel-line:#b4d2d9;
  --cell:rgba(255,255,255,.6);--accent:#d9472f;--accent-ink:#fff;--btn:#0f2d3a;--btn-ink:#fff;
  --lit1:#d9472f;--lit2:#1f6f8b;--lit3:#c27d12;--ring:#d9472f;--face:#fff;--face-ink:#0f2d3a}
[data-theme=autumn]{--page:#2a1c14;--ink:#f6e7cf;--muted:#c2a88a;--line:rgba(246,231,207,.2);--panel:rgba(42,26,18,.86);--panel-line:rgba(224,122,46,.35);
  --cell:rgba(0,0,0,.2);--accent:#e07a2e;--accent-ink:#2a1205;--btn:#e07a2e;--btn-ink:#2a1205;
  --lit1:#c2452d;--lit2:#d66f22;--lit3:#9a7d1f;--ring:#c2452d;--face:#f6e7cf;--face-ink:#2a1c14}
[data-theme=fete]{--page:#f6efe0;--ink:#2b2a26;--muted:#75705f;--line:#ddd2b8;--panel:rgba(255,250,240,.93);--panel-line:#e2d6bb;
  --cell:#fffdf7;--accent:#d2453b;--accent-ink:#fff;--btn:#2b2a26;--btn-ink:#fffaf0;
  --lit1:#d2453b;--lit2:#2f6db0;--lit3:#3d8b4f;--ring:#2f6db0;--face:#fff;--face-ink:#2b2a26}
[data-theme=fireworks]{--page:#04061a;--ink:#eef0ff;--muted:#8d95c4;--line:#262d63;--panel:rgba(5,8,26,.85);--panel-line:#2c3470;
  --cell:rgba(0,0,0,.25);--accent:#ffcf5c;--accent-ink:#2a1d00;--btn:#ffcf5c;--btn-ink:#2a1d00;
  --lit1:#ff5d5d;--lit2:#ffcf5c;--lit3:#4cc9f0;--ring:#ffcf5c;--face:#0b1030;--face-ink:#fff}

html{background:var(--page)}
body{font-family:var(--font);color:var(--ink);background:var(--page);min-height:100vh;font-size:16px;line-height:1.45;transition:background .3s}
.bg{position:fixed;inset:0;z-index:-2}
[data-theme=christmas] .bg{background:linear-gradient(170deg,#06251b,#0f4a33 50%,#4a0f1b)}
[data-theme=seaside] .bg{background:linear-gradient(180deg,#a9d8e8,#dff0f2 55%,#f1e2c2)}
[data-theme=autumn] .bg{background:radial-gradient(ellipse at 85% 0%,rgba(224,122,46,.28),transparent 55%),linear-gradient(170deg,#3a2216,#4e2816 55%,#24170f)}
[data-theme=fete] .bg{background:repeating-linear-gradient(0deg,rgba(210,69,59,.06) 0 26px,transparent 26px 52px),repeating-linear-gradient(90deg,rgba(210,69,59,.06) 0 26px,transparent 26px 52px),#f6efe0}
[data-theme=fireworks] .bg{background:linear-gradient(180deg,#02030f,#0b1233 65%,#241a44)}
#sky,#scene,#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fx{width:100%;height:100%}
#scene>*{position:absolute}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}

/* christmas */
#lights{position:fixed;left:0;right:0;top:0;height:56px;z-index:3;pointer-events:none;display:none}
[data-theme=christmas] #lights{display:block}
#lights svg{position:absolute;inset:0;width:100%;height:100%}
.bulb{position:absolute;width:11px;height:16px;margin-left:-5.5px;border-radius:50% 50% 55% 55%;animation:twinkle 2.4s ease-in-out infinite}
.bulb::before{content:"";position:absolute;left:2px;top:-5px;width:7px;height:6px;background:#2a2a2a;border-radius:2px}
.tree{bottom:0;width:clamp(110px,13vw,190px)}
.tree.l{left:1.5vw}.tree.r{right:1.5vw;transform:scaleX(-1)}
.tree .b{animation:twinkle 2s ease-in-out infinite}
body[data-theme=christmas] .app{padding-top:72px}

/* seaside */
.sunny{right:8vw;top:8vh;width:min(16vw,150px);aspect-ratio:1;border-radius:50%;background:#fff3c4;box-shadow:0 0 60px 20px rgba(255,236,170,.55);animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{to{box-shadow:0 0 80px 34px rgba(255,236,170,.7)}}
.cloud{left:0;height:26px;border-radius:999px;background:#fff;opacity:.85;animation:drift var(--d) linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:#fff}
.cloud::before{width:44%;aspect-ratio:1;left:16%;bottom:40%}
.cloud::after{width:30%;aspect-ratio:1;left:50%;bottom:30%}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(115vw)}}
.gull{left:0;width:24px;animation:fly var(--d) linear infinite}
.gull path{fill:none;stroke:#2c4752;stroke-width:1.8;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:flap .7s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(-8vw,0)}25%{transform:translate(25vw,-14px)}50%{transform:translate(55vw,8px)}75%{transform:translate(85vw,-10px)}100%{transform:translate(112vw,0)}}
@keyframes flap{to{transform:scaleY(.45)}}
.wave{left:0;right:0;bottom:0;background:var(--w) repeat-x 0 0/400px 44px,linear-gradient(var(--c),var(--c)) no-repeat 0 43px/100% 100%;
  animation:swell var(--d) linear infinite,bob 5s ease-in-out infinite alternate}
.wave.back{animation-direction:reverse,alternate}
@keyframes swell{to{background-position:400px 0,0 43px}}
@keyframes bob{to{transform:translateY(6px)}}

/* autumn: leaves fall on the canvas; a lamp glow breathes in the corner */
.lamp{right:-10vw;top:-10vh;width:60vw;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,170,80,.16),transparent 60%);animation:breathe2 9s ease-in-out infinite alternate}
@keyframes breathe2{to{opacity:.55;transform:scale(1.08)}}

/* fete */
#bunting{position:fixed;left:0;right:0;top:0;height:64px;z-index:3;pointer-events:none;display:none}
[data-theme=fete] #bunting{display:block}
#bunting svg{position:absolute;inset:0;width:100%;height:100%}
.flag{position:absolute;width:24px;height:30px;margin-left:-12px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
body[data-theme=fete] .app{padding-top:76px}
.balloon{bottom:-140px;width:42px;height:52px;border-radius:50% 50% 47% 47%/55% 55% 45% 45%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.65),transparent 28%),var(--c);opacity:.85;animation:rise var(--d) linear infinite}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:64px;background:rgba(43,42,38,.35)}
@keyframes rise{0%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(3vw,-65vh) rotate(4deg)}100%{transform:translate(-1vw,-135vh) rotate(-3deg)}}

/* fireworks */
.city{left:0;bottom:0;width:100%;height:15%;fill:#04050d}
.glow{left:0;right:0;bottom:0;height:30%;background:linear-gradient(to top,rgba(255,150,60,.18),transparent)}

/* layout */
.app{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:32px 20px 32px}
header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
[data-theme]:not([data-theme=classic]) header{border-bottom-color:var(--panel-line)}
h1{font-weight:800;font-size:clamp(1.9rem,4.5vw,2.8rem);letter-spacing:-.03em;line-height:1}
#count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:24px}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center}
.label{font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* the drawn ball */
.ball{margin:14px 0 16px;width:176px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:var(--face);border:14px solid var(--ring);box-shadow:inset 0 -6px 0 rgba(0,0,0,.06),0 2px 0 rgba(0,0,0,.08)}
.ball-face{font-weight:800;font-size:4.2rem;letter-spacing:-.04em;line-height:1;color:var(--face-ink);font-variant-numeric:tabular-nums}
.ball.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{transform:scale(.6) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}

.say{min-height:3em;font-size:1.05rem;display:none;margin-bottom:6px}
.say.on{display:block}
.say small{display:block;color:var(--muted);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
#say-text{font-style:italic}
.recent{display:flex;gap:6px;min-height:34px;margin:2px 0 20px;align-items:center}
.recent span{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:600;
  border:1.5px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.recent span:first-child{border-color:var(--ink)}

/* controls */
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
button,select{font:inherit}
button{cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:9px 10px;font-size:.92rem;font-weight:600;
  transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled){border-color:var(--ink)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.primary{grid-column:1/-1;background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-size:1.1rem;padding:14px;font-weight:800}
button.primary:hover:not(:disabled){filter:brightness(1.12);border-color:var(--btn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);width:100%;display:grid;gap:12px;text-align:left;font-size:.92rem}
.opts label{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opts input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
select{background:var(--cell);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:5px 8px}
select option{background:var(--panel);color:var(--ink)}
.hint{font-size:.82rem;color:var(--muted);margin-top:16px}
kbd{font:inherit;font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
.msg{margin-top:10px;color:var(--accent);font-size:.9rem;min-height:1.3em}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:.85rem;padding-bottom:28px}

/* board */
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}
.cell{position:relative;width:100%;min-width:0;line-height:1;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;font-size:clamp(.72rem,1.6vw,1.08rem);
  font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);border:1.5px solid var(--line);background:var(--cell);
  transition:background .25s,color .25s,border-color .25s}
.cell.on{color:#fff;background:var(--c,var(--accent));border-color:var(--c,var(--accent));font-weight:800}
.cell.on:nth-child(3n+1),.recent span:nth-child(3n+1){--c:var(--lit1)}
.cell.on:nth-child(3n+2),.recent span:nth-child(3n+2){--c:var(--lit2)}
.cell.on:nth-child(3n),.recent span:nth-child(3n){--c:var(--lit3)}
.cell.latest{animation:stamp .35s ease-out}
.cell.latest::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);pointer-events:none}
@keyframes stamp{0%{transform:scale(1.35)}100%{transform:none}}
/* classic: dauber marks look slightly hand-stamped */
[data-theme=classic] .cell.on{background:radial-gradient(circle at 48% 52%,#111 60%,#333 100%);transform:rotate(-4deg)}
[data-theme=classic] .cell.on:nth-child(2n){transform:rotate(3deg)}
[data-theme=classic] .cell.latest{transform:none}

[data-theme=christmas] .cell.on{border:0;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.85),rgba(255,255,255,.35) 9%,transparent 24%),radial-gradient(circle closest-side,var(--c) 64%,rgba(0,0,0,.45));
  box-shadow:0 2px 6px rgba(0,0,0,.4)}
[data-theme=seaside] .cell.on{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
[data-theme=autumn] .cell.on{color:#fff6e6}
[data-theme=fete] .cell.on{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 1px 0 rgba(0,0,0,.15)}
[data-theme=fireworks] .cell.on{background:radial-gradient(circle,var(--c) -30%,rgba(0,0,10,.85) 80%);border-color:var(--c)}
[data-theme]:not([data-theme=classic]) .recent span{border-color:var(--c);color:var(--ink)}

/* big screen */
body.display .stage .btns,body.display .opts,body.display .hint,body.display #bigbtn,body.display footer,body.display .msg{display:none!important}
.ball{position:relative}
.screen-tools{display:none}
body.display{overflow:hidden}
body.display.idle{cursor:none}
body.display .app{max-width:none;height:100vh;height:100dvh;padding:2.5vh 3vw;display:flex;flex-direction:column}
body.display[data-theme=christmas] .app{padding-top:64px}
body.display[data-theme=fete] .app{padding-top:70px}
body.display header{margin-bottom:2vh;padding-bottom:1.2vh;align-items:center}
body.display h1{font-size:min(3.6vw,5.5vh)}
body.display #count{font-size:min(2vw,3.2vh);color:var(--ink);font-weight:600}
body.display .layout{flex:1;min-height:0;grid-template-columns:minmax(0,37fr) minmax(0,63fr);gap:2vw;align-items:stretch}
body.display .panel{padding:3vh 2vw;min-height:0}
body.display .stage{justify-content:center}
body.display .label{font-size:min(1.3vw,2.1vh)}
body.display .ball{width:min(27vw,46vh);border-width:min(2.2vw,3.8vh);margin:2.5vh 0}
body.display .ball-face{font-size:min(11.5vw,19vh)}
body.display .ball.pop::after{content:"";position:absolute;inset:calc(-1*min(2.2vw,3.8vh));border-radius:50%;border:4px solid var(--ring);animation:ripple 1.1s ease-out .25s both;pointer-events:none}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.3);opacity:0}}
body.display .say{display:none!important}
body.display .recent{gap:min(.8vw,1.2vh);margin:1vh 0 0;min-height:min(4.2vw,6.8vh)}
body.display .recent span{width:min(4.2vw,6.8vh);height:min(4.2vw,6.8vh);font-size:min(1.6vw,2.6vh);border-width:2px}
body.display .board-panel{container-type:size;display:grid;place-items:center}
body.display .board{width:min(100cqw,108cqh);container-type:inline-size;gap:.8cqw}
body.display .cell{font-size:3.7cqw;border-width:2px}
body.display .screen-tools{display:block;position:fixed;right:16px;bottom:16px;z-index:5;transition:opacity .4s}
body.display.idle .screen-tools{opacity:0;pointer-events:none}
.screen-tools button{background:var(--panel);font-size:.85rem}

@media(max-width:820px){.layout,body.display .layout{grid-template-columns:1fr}.board{gap:4px}.tree{display:none}
  body.display{overflow:auto}body.display .app{height:auto}body.display .board-panel{container-type:normal}body.display .board{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<div id="sky"></div>
<div id="scene"></div>
<canvas id="fx"></canvas>
<div id="lights"></div>
<div id="bunting"></div>

<main class="app">
  <header>
    <h1>Bingo caller</h1>
    <div id="count" aria-live="polite"></div>
  </header>

  <div class="layout">
    <section class="panel stage" aria-label="Current number">
      <div class="label">Current number</div>
      <div class="ball" id="ball"><div class="ball-face" id="number">–</div></div>
      <div class="say" id="say"><small>Say</small><span id="say-text"></span></div>
      <div class="recent" id="recent" aria-label="Previous numbers"></div>
      <div class="btns">
        <button class="primary" id="draw">Next number</button>
        <button id="undo">Undo</button>
        <button id="reset">New game</button>
        <button id="bigbtn">Big screen</button>
      </div>
      <div class="opts">
        <label>Theme <select id="theme"></select></label>
        <label for="opt-say">Show caller phrase <input type="checkbox" id="opt-say"></label>
      </div>
      <p class="hint"><kbd>Space</kbd> next number · <kbd>U</kbd> undo</p>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <section class="panel board-panel" aria-label="All numbers">
      <div class="board" id="board"></div>
    </section>
  </div>
</main>
<div class="screen-tools"><button id="fsbtn">Full screen <kbd>F</kbd></button></div>
<footer>hello dad 😈</footer>

<script>
const TOTAL = 90;
const KEY = "bingoCallerState_v1";
const isDisplay = location.hash === "#display";

const CALLS = {1:"Kelly's Eye",2:"One Little Duck",3:"Cup of Tea",4:"Knock at the Door",5:"Man Alive",6:"Tom Mix / half a dozen",7:"Lucky Seven",8:"Garden Gate",9:"Doctor's Orders",10:"Starmer's Den",11:"Legs Eleven",12:"One Dozen",13:"Unlucky for Some",14:"Valentine's Day",15:"Young and Keen",16:"Sweet Sixteen",17:"Dancing Queen",18:"Coming of Age",19:"Goodbye Teens",20:"One Score",21:"Royal Salute / key to the door",22:"Two Little Ducks",23:"Thee and Me",24:"Two Dozen",25:"Duck and Dive",26:"Pick and Mix",27:"Gateway to Heaven",28:"In a State",29:"Rise and Shine",30:"Dirty Gertie",31:"Get Up and Run",32:"Buckle My Shoe",33:"Dirty Knee / all the threes",34:"Ask for More",35:"Jump and Jive",36:"Three Dozen",37:"More than Eleven",38:"Christmas Cake",39:"Steps",40:"Naughty Forty",41:"Time for Fun",42:"Winnie the Pooh",43:"Down on Your Knees",44:"Droopy Drawers",45:"Halfway There",46:"Up to Tricks",47:"Four and Seven",48:"Four Dozen",49:"PC",50:"Half a Century",51:"Tweak of the Thumb",52:"Weeks in a Year",53:"Stuck in the Tree / Here Comes Herbie",54:"Clean the Floor",55:"Snakes Alive",56:"Was She Worth It?",57:"Heinz Varieties",58:"Make Them Wait",59:"Brighton Line",60:"Five Dozen",61:"Bakers Bun",62:"Turn the Screw / tickety-boo",63:"Tickle Me 63",64:"Red Raw",65:"Old Age Pension",66:"Clickety Clicks",67:"Made in Heaven",68:"Saving Grace",69:"Either Way Up",70:"Three Score and Ten",71:"Bang on the Drum",72:"Six Dozen",73:"Queen Bee",74:"Candy Store / hit the floor",75:"Strive and Strive",76:"Trombones",77:"Sunset Strip",78:"Heaven's Gate / 39 more steps",79:"One More Time",80:"Eight and Blank",81:"Stop and Run",82:"Straight On Through",83:"Time for Tea",84:"Seven Dozen",85:"Staying Alive",86:"Between the Sticks",87:"Torquay in Devon",88:"Two Fat Ladies",89:"Nearly There",90:"Top of the Shop"};

const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const el = {number:$("number"), ball:$("ball"), board:$("board"), recent:$("recent"), count:$("count"), draw:$("draw"),
  undo:$("undo"), reset:$("reset"), big:$("bigbtn"), theme:$("theme"), say:$("say"), sayText:$("say-text"),
  optSay:$("opt-say"), msg:$("msg"), sky:$("sky"), scene:$("scene"), lights:$("lights")};

let history = [], remaining = [], themeIndex = 0, showSay = false, bigWin = null;

/* scenery */
const treeSvg = side => {
  const baubles = [[60,40,"#ff4757"],[46,70,"#ffd166"],[74,84,"#4cc9f0"],[36,114,"#ff4757"],[62,106,"#ffd166"],[88,126,"#ff8fd0"],[50,138,"#4cc9f0"],[78,58,"#ff4757"]]
    .map(([x,y,c],i) => `<circle class="b" cx="${x}" cy="${y}" r="4.5" fill="${c}" style="animation-delay:${i*.35}s"/>`).join("");
  return `<svg class="tree ${side}" viewBox="0 0 120 170" aria-hidden="true">
    <rect x="52" y="150" width="16" height="18" fill="#4a2a14"/>
    <path d="M60 12 L92 62 H78 L104 104 H86 L112 148 H8 L34 104 H16 L42 62 H28Z" fill="#12573a"/>
    <path d="M60 12 L92 62 H78 L104 104 H86 L112 148 H60Z" fill="#0d4a30" opacity=".7"/>
    <path d="M34 66Q60 80 86 62M22 108Q60 126 98 104" stroke="#ffd966" stroke-width="2" fill="none" opacity=".8"/>
    <polygon points="60,0 64,10 75,10 66,17 69,28 60,21 51,28 54,17 45,10 56,10" fill="#ffd966"/>${baubles}</svg>`;
};
const waveImg = c => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='400' height='44'><path d='M0 22 Q100 4 200 22 T400 22 V44 H0Z' fill='${c}'/></svg>`)}")`;
const wave = (c, h, d, back) => `<div class="wave${back ? " back" : ""}" style="height:${h}%;--c:${c};--w:${waveImg(c)};--d:${d}s"></div>`;
const seaScene = `<div class="sunny"></div>
  ${[[9,190,110],[17,130,80],[26,240,140],[13,160,95]].map(([top,w,d],i) => `<div class="cloud" style="top:${top}vh;width:${w}px;--d:${d}s;animation-delay:${-i*d/3.2}s"></div>`).join("")}
  ${[[20,38],[28,52],[16,46]].map(([top,d],i) => `<svg class="gull" viewBox="0 0 24 10" style="top:${top}vh;--d:${d}s;animation-delay:${-i*14}s" aria-hidden="true"><path d="M1 8 Q6 1 12 7 Q18 1 23 8"/></svg>`).join("")}
  ${wave("#a7d6df",19,16)}${wave("#6fb2c4",14,11,true)}${wave("#3f8aa2",9,8)}`;
const leafScene = `<div class="lamp"></div>`;
const feteScene = [["#d2453b",4,34,0],["#2f6db0",12,42,-14],["#e8b730",86,38,-6],["#3d8b4f",93,46,-25],["#d2453b",70,52,-38]]
  .map(([c,left,d,delay]) => `<div class="balloon" style="left:${left}%;--c:${c};--d:${d}s;animation-delay:${delay}s"></div>`).join("");
const cityScene = `<div class="glow"></div><svg class="city" viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 120V78H50V52H84V70H120V36H158V66H196V84H240V48H282V74H330V28H366V62H410V80H456V44H500V70H548V90H590V54H632V30H676V66H720V82H770V46H812V72H860V38H902V64H950V80H1000V120Z"/></svg>`;

const THEMES = [
  {key:"classic", name:"Classic"},
  {key:"christmas", name:"Christmas", fx:"snow", stars:70, scene:treeSvg("l") + treeSvg("r")},
  {key:"fireworks", name:"Fireworks", fx:"fireworks", stars:80, scene:cityScene},
  {key:"seaside", name:"Seaside", scene:seaScene},
  {key:"autumn", name:"Autumn", fx:"leaves", scene:leafScene},
  {key:"fete", name:"Village fete", scene:feteScene}
];

/* canvas effects: falling snow and fireworks share one canvas */
const fx = (() => {
  const cv = $("fx"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
  const GRAVITY = 260;
  let W = 0, H = 0, mode = null, raf = 0, last = 0, t = 0, nextShot = 0;
  let flakes = [], sparks = [], rockets = [], leaves = [];

  function newFlake(anywhere){
    const d = Math.random();
    return {x:rnd(0,W), y:anywhere ? rnd(0,H) : rnd(-20,-4), r:1.2 + d*d*2.8, d, vy:24 + d*58, ph:rnd(0,6.3), fq:rnd(.6,1.6), sw:rnd(8,22)};
  }
  function fit(){
    const ratio = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*ratio; cv.height = H*ratio; ctx.setTransform(ratio,0,0,ratio,0,0);
    if(mode === "snow"){
      const n = Math.round(Math.min(240, Math.max(90, W*H/7000)));
      while(flakes.length < n) flakes.push(newFlake(true));
      flakes.length = n;
    }
    if(mode === "leaves"){
      const n = Math.round(Math.min(70, Math.max(26, W*H/26000)));
      while(leaves.length < n) leaves.push(newLeaf(true));
      leaves.length = n;
    }
  }

  function snowFrame(dt){
    const wind = Math.sin(t*.23)*14 + Math.sin(t*.071)*9;
    ctx.clearRect(0,0,W,H);
    for(const f of flakes){
      f.y += f.vy*dt;
      f.x += (Math.sin(t*f.fq + f.ph)*f.sw + wind*(.4 + f.d*.6)) * dt;
      if(f.x < -10) f.x += W + 20; else if(f.x > W + 10) f.x -= W + 20;
      if(f.y > H + 6) Object.assign(f, newFlake(false));
      const a = .45 + f.d*.5;
      if(f.r > 2.6){ ctx.fillStyle = `rgba(255,255,255,${a*.18})`; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*2,0,6.283); ctx.fill(); }
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.283); ctx.fill();
    }
  }

  const LEAF_COLS = ["#c2452d","#e07a2e","#d9a33a","#8a3b1f","#b5612a"];
  function newLeaf(anywhere){
    return {x:rnd(0,W), y:anywhere ? rnd(0,H) : rnd(-40,-10), s:rnd(6,13), vy:rnd(28,62), rot:rnd(0,6.3), vr:rnd(-1.4,1.4),
      ph:rnd(0,6.3), fq:rnd(.5,1.2), sw:rnd(20,50), flip:rnd(0,6.3), vf:rnd(1.5,3.5), c:LEAF_COLS[Math.floor(rnd(0,LEAF_COLS.length))]};
  }
  function leafFrame(dt){
    const wind = Math.sin(t*.17)*18 + 8;
    ctx.clearRect(0,0,W,H);
    for(const l of leaves){
      l.y += l.vy*dt; l.rot += l.vr*dt; l.flip += l.vf*dt;
      l.x += (Math.sin(t*l.fq + l.ph)*l.sw + wind) * dt;
      if(l.x > W + 20) l.x -= W + 40; else if(l.x < -20) l.x += W + 40;
      if(l.y > H + 20) Object.assign(l, newLeaf(false));
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot); ctx.scale(1, .35 + .65*Math.abs(Math.cos(l.flip)));
      ctx.fillStyle = l.c; ctx.globalAlpha = .85;
      ctx.beginPath(); ctx.moveTo(-l.s,0); ctx.quadraticCurveTo(0,-l.s*.7,l.s,0); ctx.quadraticCurveTo(0,l.s*.7,-l.s,0); ctx.fill();
      ctx.strokeStyle = "rgba(40,20,10,.45)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-l.s*1.2,0); ctx.lineTo(l.s*.8,0); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function launch(){
    const apex = rnd(.14,.5)*H;
    rockets.push({x:rnd(.1,.9)*W, y:H, vx:rnd(-18,18), vy:-Math.sqrt(2*GRAVITY*(H-apex)), hue:rnd(0,360)});
  }
  function explode(x, y, hue){
    const kind = ["burst","ring","willow"][Math.floor(rnd(0,3))];
    const other = Math.random() < .4 ? (hue + rnd(120,240)) % 360 : hue;
    const n = kind === "burst" ? 95 : 64;
    for(let i=0;i<n;i++){
      const a = kind === "burst" ? rnd(0,6.283) : i/n*6.283;
      const sp = kind === "burst" ? rnd(30,190) : kind === "ring" ? 140 + rnd(-5,5) : rnd(40,120);
      sparks.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, age:0, max:kind === "willow" ? rnd(2,2.8) : rnd(1,1.6),
        hue:kind === "willow" ? 42 : i%2 ? hue : other, light:kind === "willow" ? 68 : 60, drag:kind === "willow" ? .9 : 1.4, g:kind === "willow" ? 110 : 80});
    }
  }
  function fireFrame(dt){
    if(t >= nextShot){ launch(); if(Math.random() < .3) launch(); nextShot = t + rnd(.6,1.6); }
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "lighter";
    rockets = rockets.filter(r => {
      r.vy += GRAVITY*dt; r.x += r.vx*dt; r.y += r.vy*dt;
      sparks.push({x:r.x, y:r.y, vx:rnd(-8,8), vy:rnd(10,30), age:0, max:.45, hue:42, light:70, drag:2, g:0});
      if(r.vy > -25){ explode(r.x, r.y, r.hue); return false; }
      return true;
    });
    sparks = sparks.filter(s => {
      s.age += dt; if(s.age >= s.max) return false;
      const k = Math.exp(-s.drag*dt);
      s.vx *= k; s.vy = s.vy*k + s.g*dt; s.x += s.vx*dt; s.y += s.vy*dt;
      ctx.fillStyle = `hsla(${s.hue},100%,${s.light}%,${1 - s.age/s.max})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.7, 0, 6.283); ctx.fill();
      return true;
    });
    ctx.globalCompositeOperation = "source-over";
  }

  function tick(ts){
    raf = requestAnimationFrame(tick);
    const dt = Math.min(.05, (ts - last)/1000 || 0);
    last = ts; t += dt;
    mode === "snow" ? snowFrame(dt) : mode === "leaves" ? leafFrame(dt) : fireFrame(dt);
  }
  addEventListener("resize", () => { if(mode) fit(); });
  return {
    run(next){
      cancelAnimationFrame(raf); raf = 0;
      mode = next || null; flakes = []; sparks = []; rockets = []; leaves = [];
      if(!mode){ ctx.clearRect(0,0,cv.width,cv.height); return; }
      fit();
      if(still){ if(mode === "snow") snowFrame(0); else if(mode === "leaves") leafFrame(0); return; }
      last = performance.now(); nextShot = t; raf = requestAnimationFrame(tick);
    }
  };
})();

/* theme */
function buildLights(){
  const W = 1000, n = 30, cols = ["#ff3b4a","#ffd166","#3ddc84","#4cc9f0","#ff8fd0"];
  const y = i => 12 + 14*Math.abs(Math.sin(i/n*Math.PI*5));
  let wire = "M0,6", bulbs = "";
  for(let i=0;i<=n;i++) wire += ` L${(i/n*W).toFixed(1)},${y(i).toFixed(1)}`;
  for(let i=0;i<n;i++){
    const c = cols[i % cols.length];
    bulbs += `<span class="bulb" style="left:${(i+.5)/n*100}%;top:${y(i+.5)+4}px;background:${c};box-shadow:0 0 10px ${c};animation-delay:${(i%5)*.45}s"></span>`;
  }
  el.lights.innerHTML = `<svg viewBox="0 0 ${W} 40" preserveAspectRatio="none" aria-hidden="true"><path d="${wire}" fill="none" stroke="#1d1d1d" stroke-width="2"/></svg>${bulbs}`;
}
function buildBunting(){
  const W = 1000, n = 26, cols = ["#d2453b","#f4ecd8","#2f6db0","#e8b730","#3d8b4f"];
  const y = i => 4 + 16*Math.sin((i/n*3 % 1)*Math.PI);
  let wire = "M0,4", flags = "";
  for(let i=0;i<=n*4;i++) wire += ` L${(i/(n*4)*W).toFixed(1)},${y(i/4).toFixed(1)}`;
  for(let i=0;i<n;i++){
    flags += `<span class="flag" style="left:${(i+.5)/n*100}%;top:${y(i+.5)+3}px;background:${cols[i % cols.length]};animation-delay:${-(i%7)*.5}s"></span>`;
  }
  $("bunting").innerHTML = `<svg viewBox="0 0 ${W} 40" preserveAspectRatio="none" aria-hidden="true"><path d="${wire}" fill="none" stroke="#6b5b45" stroke-width="1.5"/></svg>${flags}`;
}
function setTheme(i){
  themeIndex = i;
  const t = THEMES[i];
  document.body.dataset.theme = t.key;
  el.sky.innerHTML = Array.from({length:t.stars || 0}, () =>
    `<i class="star" style="left:${rnd(0,100)}%;top:${rnd(0,55)}%;animation-duration:${rnd(2,5)}s;animation-delay:${-rnd(0,5)}s"></i>`).join("");
  el.scene.innerHTML = t.scene || "";
  fx.run(t.fx);
  el.theme.value = i;
  save();
}

/* saving */
function validNums(a){
  return Array.isArray(a) && a.every(n => Number.isInteger(n) && n >= 1 && n <= TOTAL) && new Set(a).size === a.length;
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    return s && validNums(s.history) ? s : null;
  }catch(e){ return null; }
}
function save(){
  if(isDisplay) return;
  try{
    localStorage.setItem(KEY, JSON.stringify({history, remaining, currentThemeIndex:themeIndex, callerPromptEnabled:showSay}));
  }catch(e){ console.warn("couldn't save", e); }
}
function applyState(s){
  history = s.history.slice();
  remaining = Array.from({length:TOTAL}, (_, i) => i + 1).filter(n => !history.includes(n));
  themeIndex = THEMES[s.currentThemeIndex] ? s.currentThemeIndex : 0;
  showSay = !!s.callerPromptEnabled;
}

/* drawing the page */
function buildBoard(){
  for(let n=1;n<=TOTAL;n++){
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-" + n; c.textContent = n;
    el.board.appendChild(c);
  }
}
function render(animate){
  const last = history[history.length - 1];
  el.number.textContent = last ?? "–";
  if(animate){ el.ball.classList.remove("pop"); void el.ball.offsetWidth; el.ball.classList.add("pop"); }
  for(let n=1;n<=TOTAL;n++){
    const c = $("cell-" + n);
    c.classList.toggle("on", history.includes(n));
    c.classList.toggle("latest", n === last);
  }
  el.recent.innerHTML = "";
  history.slice(-6, -1).reverse().forEach(n => {
    const s = document.createElement("span"); s.textContent = n; el.recent.appendChild(s);
  });
  el.count.textContent = history.length ? `${history.length} of ${TOTAL} called` : "No numbers called yet";
  el.say.classList.toggle("on", showSay);
  el.sayText.textContent = last ? (CALLS[last] ? `${CALLS[last]}, number ${last}` : `Number ${last}`) : "Waiting for the first number";
  el.draw.disabled = remaining.length === 0;
  el.draw.textContent = remaining.length ? "Next number" : "All 90 called";
  el.undo.disabled = history.length === 0;
  el.optSay.checked = showSay;
}

/* buttons */
function drawNumber(){
  if(!remaining.length){ el.msg.textContent = "That's all 90. Time to check the cards."; return; }
  history.push(remaining.splice(Math.floor(Math.random() * remaining.length), 1)[0]);
  el.msg.textContent = "";
  save(); render(true);
}
function undoLast(){
  if(!history.length) return;
  remaining.push(history.pop());
  el.msg.textContent = "Put the last number back in the bag.";
  save(); render(false);
}
function newGame(){
  if(history.length && !confirm("Start a new game? The numbers called so far will be cleared.")) return;
  history = []; remaining = Array.from({length:TOTAL}, (_, i) => i + 1);
  el.msg.textContent = "";
  save(); render(false);
}
function openBigScreen(){
  if(bigWin && !bigWin.closed){ bigWin.focus(); return; }
  bigWin = window.open(location.href.split("#")[0] + "#display", "bingo_display", "width=1200,height=720");
  if(!bigWin) el.msg.textContent = "The big-screen window was blocked. Allow pop-ups for this page and try again.";
}

window.enableCallerPrompt  = () => { showSay = true;  save(); render(false); };
window.disableCallerPrompt = () => { showSay = false; save(); render(false); };

/* start up */
THEMES.forEach((t, i) => { const o = document.createElement("option"); o.value = i; o.textContent = t.name; el.theme.appendChild(o); });
buildBoard(); buildLights(); buildBunting();

const saved = load();
if(saved) applyState(saved); else remaining = Array.from({length:TOTAL}, (_, i) => i + 1);
setTheme(themeIndex);
render(false);

if(isDisplay){
  document.body.classList.add("display");
  document.title = "Bingo – big screen";
  // the big-screen window just follows the main one through localStorage
  addEventListener("storage", e => {
    if(e.key !== KEY) return;
    const s = load(); if(!s) return;
    const lastBefore = history[history.length - 1], themeBefore = themeIndex;
    applyState(s);
    if(themeIndex !== themeBefore) setTheme(themeIndex);
    render(history.length > 0 && history[history.length - 1] !== lastBefore);
  });
  const fsBtn = $("fsbtn");
  const toggleFull = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
  fsBtn.onclick = toggleFull;
  document.addEventListener("fullscreenchange", () => {
    fsBtn.firstChild.textContent = document.fullscreenElement ? "Exit full screen " : "Full screen ";
  });
  document.addEventListener("keydown", e => { if(e.key.toLowerCase() === "f" && !e.ctrlKey && !e.metaKey) toggleFull(); });
  document.addEventListener("dblclick", toggleFull);
  let idleTimer = 0;
  const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500); };
  addEventListener("mousemove", wake); wake();
}else{
  el.draw.onclick = drawNumber; el.undo.onclick = undoLast; el.reset.onclick = newGame; el.big.onclick = openBigScreen;
  el.theme.onchange = () => setTheme(parseInt(el.theme.value, 10) || 0);
  el.optSay.onchange = () => { showSay = el.optSay.checked; save(); render(false); };
  document.addEventListener("keydown", e => {
    if(e.target.closest("select,input,button") || e.ctrlKey || e.metaKey) return;
    if(e.code === "Space"){ e.preventDefault(); drawNumber(); }
    else if(e.key.toLowerCase() === "u") undoLast();
  });
}
</script>
</body>
</html>
