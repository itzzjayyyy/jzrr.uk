<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo Caller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#101c2e;--bg2:#0a1220;--panel:#16253b;--line:#2a3d59;--ink:#e8eef7;--muted:#7f93ad;
  --accent:#5eead4;--accent-ink:#06201c;--ball:#2b6cb0;--ball2:#143a66;--face:#f4f7fb;--face-ink:#12243d;
  --lit1:#2b8f86;--lit2:#2b8f86;--lit3:#2b8f86;--lit-hi:#7fe0d4;
  --sans:'Roboto Condensed',system-ui,sans-serif;--serif:'Orbitron',system-ui,sans-serif;--sec:#00bcd4;--bubble:rgba(0,0,0,.7);--bg-gradient:linear-gradient(-45deg,#1a237e,#0d47a1,#64ffda,#00bcd4);
}
html{background:var(--bg2)}
body{font-family:var(--sans);color:var(--ink);min-height:100vh;font-size:17px}
.gradient-container{position:fixed;inset:0;z-index:-2;background:var(--bg-gradient);background-size:400% 400%;animation:gradientBG 10s ease infinite}
@keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#overlay,#lights{position:fixed;left:0;right:0;pointer-events:none;overflow:hidden}
#overlay{inset:0;z-index:0}
#lights{top:0;height:56px;z-index:3;display:none}
[data-theme=christmas] #lights{display:block}
#lights svg{position:absolute;inset:0;width:100%;height:100%}
.bulb{position:absolute;width:12px;height:18px;margin-left:-6px;border-radius:50% 50% 55% 55%;
  animation:twinkle 2.4s ease-in-out infinite}
.bulb::before{content:"";position:absolute;left:2px;top:-5px;width:8px;height:6px;background:#2a2a2a;border-radius:2px}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.15)}50%{opacity:.55;filter:brightness(.7)}}
.flake{position:absolute;top:-10px;border-radius:50%;background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx,0),110vh,0)}}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#e6f26b;box-shadow:0 0 8px #e6f26b;animation:drift ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0);opacity:.25}to{transform:translate(28px,-22px);opacity:1}}
.conf{position:absolute;top:-20px;width:7px;height:14px;animation:fall linear infinite}

/* scenery layers per theme */
#overlay::before,#overlay::after{content:"";position:absolute;display:none;pointer-events:none}
.orb{position:absolute;bottom:-60px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.4),rgba(255,255,255,.04));animation:rise linear infinite}
.balloon{position:absolute;bottom:-80px;width:34px;height:42px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;animation:rise linear infinite;opacity:.85}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:34px;background:rgba(255,255,255,.5)}
@keyframes rise{to{transform:translate3d(var(--dx,0),-120vh,0)}}
[data-theme=snowy-night] #overlay::before{display:block;top:0;left:-10%;width:120%;height:55%;filter:blur(40px);opacity:.7;
  background:linear-gradient(100deg,transparent 8%,rgba(80,255,200,.3) 35%,rgba(130,120,255,.3) 62%,transparent 88%);animation:aurora 16s ease-in-out infinite alternate}
@keyframes aurora{from{transform:translateX(-7%) skewX(-10deg)}to{transform:translateX(7%) skewX(9deg)}}
[data-theme=firefly-meadow] #overlay::before{display:block;top:7%;right:9%;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe0,#e6dfa0);box-shadow:0 0 60px 20px rgba(255,250,200,.22)}
[data-theme=firefly-meadow] #overlay::after{display:block;left:0;right:0;bottom:0;height:20%;
  background:radial-gradient(ellipse 60% 100% at 18% 100%,#03180f 97%,transparent 100%),radial-gradient(ellipse 70% 100% at 78% 100%,#021208 97%,transparent 100%)}
[data-theme=christmas] #overlay::before{display:block;inset:0;filter:blur(5px);animation:bokeh 5s ease-in-out infinite alternate;
  background:radial-gradient(circle at 8% 78%,rgba(255,206,110,.28) 0 34px,transparent 35px),radial-gradient(circle at 22% 90%,rgba(255,110,110,.2) 0 24px,transparent 25px),
  radial-gradient(circle at 90% 70%,rgba(255,206,110,.25) 0 40px,transparent 41px),radial-gradient(circle at 76% 92%,rgba(120,220,160,.2) 0 28px,transparent 29px),
  radial-gradient(circle at 50% 96%,rgba(255,206,110,.22) 0 30px,transparent 31px)}
@keyframes bokeh{from{opacity:.45}to{opacity:1}}
[data-theme=christmas] #overlay::after{display:block;left:-5%;right:-5%;bottom:-2%;height:9%;
  background:radial-gradient(ellipse 30% 100% at 15% 100%,#eef4f2 96%,transparent 100%),radial-gradient(ellipse 36% 100% at 55% 100%,#dfe9e6 96%,transparent 100%),radial-gradient(ellipse 28% 100% at 92% 100%,#eef4f2 96%,transparent 100%);opacity:.92}
[data-theme=synthwave] #overlay::before{display:block;left:50%;bottom:34%;width:min(46vw,420px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;opacity:.6;
  background:linear-gradient(#ffd166,#ff2a6d 58%,#a100ff);-webkit-mask-image:repeating-linear-gradient(#000 0 14px,transparent 14px 19px);mask-image:repeating-linear-gradient(#000 0 14px,transparent 14px 19px)}
[data-theme=synthwave] #overlay::after{display:block;left:-60%;right:-60%;bottom:0;height:38%;transform:perspective(260px) rotateX(58deg);transform-origin:bottom;
  background:repeating-linear-gradient(90deg,rgba(0,229,255,.6) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,rgba(0,229,255,.6) 0 2px,transparent 2px 56px);
  animation:grid 1.6s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
@keyframes grid{to{background-position:0 0,0 56px}}
[data-theme=deep-ocean] #overlay::before{display:block;top:0;left:-10%;width:120%;height:75%;opacity:.8;
  background:repeating-linear-gradient(105deg,rgba(190,240,255,.09) 0 36px,transparent 36px 130px);
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-3%)}to{transform:translateX(3%)}}

/* scene layer: set pieces drawn per theme */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.beam{position:absolute;bottom:-10%;left:14%;width:200px;height:120vh;transform-origin:50% 100%;clip-path:polygon(46% 100%,54% 100%,100% 0,0 0);
  background:linear-gradient(to top,rgba(255,255,255,.16),transparent);animation:beam 9s ease-in-out infinite alternate}
.beam.r{left:auto;right:14%;animation-direction:alternate-reverse;animation-duration:11s}
@keyframes beam{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.spokes{position:absolute;left:12%;top:92px;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;
  background:repeating-conic-gradient(rgba(255,255,255,.09) 0 5deg,transparent 5deg 19deg);animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.disco{position:absolute;top:0;left:12%;margin-left:-45px;width:90px;transform-origin:50% 0;animation:swing 4s ease-in-out infinite alternate}
.disco::before{content:"";display:block;width:2px;height:46px;margin:0 auto;background:#9aa}
.disco i{display:block;width:90px;height:90px;border-radius:50%;box-shadow:0 0 40px rgba(255,255,255,.55);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95),transparent 38%),repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 9px),repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 1px,transparent 1px 9px),radial-gradient(circle,#c9ccd6,#5b5f70)}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.tree{position:absolute;bottom:2%;width:clamp(110px,13vw,190px)}
.tree.l{left:1.5vw}.tree.r{right:1.5vw;transform:scaleX(-1)}
.tree .b{animation:twinkle 2s ease-in-out infinite}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
.sky{position:absolute;left:0;bottom:0;width:100%;height:15%}
.burst{position:absolute;width:0;height:0}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);animation:burst 1.5s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{70%{opacity:1}to{transform:translate(var(--x),calc(var(--y) + 50px));opacity:0}}
.hmoon{position:absolute;top:6%;right:8%;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffd89a,#ff9a2e 72%);box-shadow:0 0 90px 30px rgba(255,140,40,.28)}
.bat{position:absolute;left:-60px;top:var(--y);width:38px;animation:fly var(--d) linear infinite;animation-delay:var(--l)}
.bat svg{display:block;animation:flap .3s ease-in-out infinite alternate}
@keyframes fly{to{transform:translate(calc(100vw + 120px),var(--dy))}}
@keyframes flap{to{transform:scaleY(.4)}}
.hills{position:absolute;left:0;right:0;bottom:0;height:16%;
  background:radial-gradient(ellipse 55% 100% at 20% 100%,#07030d 97%,transparent 100%),radial-gradient(ellipse 60% 100% at 80% 100%,#05020a 97%,transparent 100%)}
.dtree{position:absolute;left:3vw;bottom:8%;width:clamp(80px,9vw,140px)}
.mq{position:absolute;background-image:radial-gradient(circle,#ffe08a 0 3px,transparent 4.5px);background-size:28px 28px;
  filter:drop-shadow(0 0 5px #ffb400);animation:chase 1s linear infinite}
.mq.t,.mq.m{left:8px;right:8px;height:28px;background-repeat:repeat-x}.mq.t{top:8px}.mq.m{bottom:8px}
.mq.l,.mq.r{top:8px;bottom:8px;width:28px;background-repeat:repeat-y}.mq.l{left:8px}.mq.r{right:8px}
.mq.o{animation-delay:-.5s}.mq.t.o,.mq.m.o{background-position:14px 0}.mq.l.o,.mq.r.o{background-position:0 14px}
@keyframes chase{0%,49%{opacity:1}50%,100%{opacity:.2}}
body[data-theme=casino] .app{padding-left:52px;padding-right:52px;padding-top:52px}
@media(max-width:820px){.disco,.spokes,.tree,.dtree{display:none}}

.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 20px 40px}
body[data-theme=christmas] .app{padding-top:64px}
header{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:26px;text-align:center}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,5vw,3rem);color:#fff;text-shadow:0 0 15px var(--accent),0 0 30px var(--sec)}
#count{color:var(--ink);opacity:.85;font-size:1rem;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(290px,370px) 1fr;gap:24px;align-items:start}
.panel{background:var(--panel);border-radius:12px;padding:26px;box-shadow:0 0 15px var(--accent)}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center}

.label{font-size:1.1rem;opacity:.9}
.ball{margin:6px 0 18px}
.ball-face{font-family:var(--serif);font-weight:700;font-size:min(5.2rem,17vw);line-height:1.2;min-height:1.2em;color:var(--ink);
  text-shadow:0 0 15px var(--accent),0 0 25px var(--sec);font-variant-numeric:tabular-nums}
.ball.pop{animation:numberPop .6s both}
@keyframes numberPop{0%{transform:scale(.4) rotateX(70deg);opacity:0;filter:blur(4px)}55%{transform:scale(1.15) rotateX(0);opacity:1;filter:blur(0)}100%{transform:scale(1)}}
.say{min-height:3.2em;font-size:1.05rem;color:var(--ink);display:none}
.say.on{display:block}
.say small{display:block;color:var(--muted);font-size:.8rem;margin-bottom:2px}
.recent{display:flex;gap:8px;min-height:38px;margin:4px 0 18px}
.recent span{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;font-weight:700;
  border:2px solid var(--accent);background:var(--bubble);box-shadow:0 0 8px var(--accent),0 0 14px var(--sec)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
button,select{font:inherit}
button{cursor:pointer;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);padding:11px 20px;font-size:1.05rem;font-weight:700;
  box-shadow:0 0 8px var(--accent),0 0 20px var(--sec);transition:transform .18s,box-shadow .18s,background .18s;animation:pulse 2.8s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 8px var(--accent),0 0 20px var(--sec)}to{box-shadow:0 0 14px var(--accent),0 0 28px var(--sec);transform:translateY(-1px) scale(1.03)}}
button:hover:not(:disabled){transform:translateY(-1px) scale(1.06);background:var(--sec)}
button:active:not(:disabled){transform:translateY(1px) scale(.97)}
button:disabled{background:#666;color:#222;box-shadow:none;animation:none;cursor:default}
button.primary{flex:1 1 100%;font-size:1.2rem;padding:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);width:100%;display:grid;gap:12px;text-align:left;font-size:.95rem}
.opts label{display:flex;align-items:center;gap:10px;justify-content:space-between;color:var(--muted)}
.opts input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
select{background:rgba(0,0,0,.7);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.hint{font-size:.8rem;color:var(--muted);margin-top:14px}

.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.cell{position:relative;width:100%;min-width:0;line-height:1;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;font-size:clamp(.7rem,1.7vw,1.15rem);
  font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);
  transition:background .4s,color .3s,box-shadow .4s}
.cell.on{color:#fff;background:var(--bubble);border:2px solid var(--accent);box-shadow:0 0 10px var(--accent),0 0 20px var(--sec)}
[data-theme=christmas] .cell.on{border-color:transparent;background:radial-gradient(circle at 34% 28%,var(--lit-hi),var(--c) 58%,rgba(0,0,0,.45) 135%);box-shadow:0 3px 8px rgba(0,0,0,.5),0 0 12px var(--c)}
.cell.on:nth-child(3n+1){--c:var(--lit1)}.cell.on:nth-child(3n+2){--c:var(--lit2)}.cell.on:nth-child(3n){--c:var(--lit3)}
.cell.latest{animation:ping .6s ease-out}
.cell.latest::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ink);pointer-events:none}
@keyframes ping{0%{transform:scale(1.5)}100%{transform:none}}
.msg{margin-top:14px;color:var(--muted);font-size:.9rem;min-height:1.2em}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:.85rem;padding-bottom:30px}

/* big-screen mode */
body.display .stage .btns,body.display .opts,body.display .hint,body.display #bigbtn,body.display .say,body.display footer{display:none!important}
body.display .layout{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center;min-height:80vh}
body.display .app{max-width:none;padding:24px 4vw}
body.display .ball-face{font-size:min(15vw,26vh)}
body.display h1{font-size:2.2rem}
body.display .recent span{width:5vw;height:5vw;font-size:1.6vw}
body.display .cell{font-size:1.8vw}

@media(max-width:820px){.layout,body.display .layout{grid-template-columns:1fr}.board{gap:5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="gradient-container"></div>
<div id="overlay"></div>
<div id="scene"></div>
<div id="lights"></div>

<div class="app">
  <header>
    <h1>Bingo caller</h1>
    <div id="count" aria-live="polite"></div>
  </header>

  <div class="layout">
    <section class="panel stage" aria-label="Current number">
      <div class="label">Current number:</div>
      <div class="ball" id="ball"><div class="ball-face" id="number">–</div></div>
      <div class="say" id="say"><small>Say</small><span id="say-text"></span></div>
      <div class="recent" id="recent" aria-label="Previous numbers"></div>
      <div class="btns">
        <button class="primary" id="draw">Next number</button>
        <button id="undo">Undo last</button>
        <button id="reset">New game</button>
        <button id="bigbtn">Big screen</button>
      </div>
      <div class="opts">
        <label>Theme <select id="theme"></select></label>
        <label for="opt-say">Show caller phrase <input type="checkbox" id="opt-say"></label>
        <label for="opt-speak">Read numbers aloud <input type="checkbox" id="opt-speak"></label>
      </div>
      <p class="hint">Space calls the next number. U undoes.</p>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <section class="panel" aria-label="All numbers">
      <div class="board" id="board"></div>
    </section>
  </div>
</div>
<footer>hello dad 😈</footer>

<script>
const TOTAL = 90;
const KEY = "bingoCallerState_v1";
const IS_DISPLAY = location.hash === "#display";

const CALLS = {1:"Kelly's Eye",2:"One Little Duck",3:"Cup of Tea",4:"Knock at the Door",5:"Man Alive",6:"Tom Mix / half a dozen",7:"Lucky Seven",8:"Garden Gate",9:"Doctor's Orders",10:"Starmer's Den",11:"Legs Eleven",12:"One Dozen",13:"Unlucky for Some",14:"Valentine's Day",15:"Young and Keen",16:"Sweet Sixteen",17:"Dancing Queen",18:"Coming of Age",19:"Goodbye Teens",20:"One Score",21:"Royal Salute / key to the door",22:"Two Little Ducks",23:"Thee and Me",24:"Two Dozen",25:"Duck and Dive",26:"Pick and Mix",27:"Gateway to Heaven",28:"In a State",29:"Rise and Shine",30:"Dirty Gertie",31:"Get Up and Run",32:"Buckle My Shoe",33:"Dirty Knee / all the threes",34:"Ask for More",35:"Jump and Jive",36:"Three Dozen",37:"More than Eleven",38:"Christmas Cake",39:"Steps",40:"Naughty Forty",41:"Time for Fun",42:"Winnie the Pooh",43:"Down on Your Knees",44:"Droopy Drawers",45:"Halfway There",46:"Up to Tricks",47:"Four and Seven",48:"Four Dozen",49:"PC",50:"Half a Century",51:"Tweak of the Thumb",52:"Weeks in a Year",53:"Stuck in the Tree / Here Comes Herbie",54:"Clean the Floor",55:"Snakes Alive",56:"Was She Worth It?",57:"Heinz Varieties",58:"Make Them Wait",59:"Brighton Line",60:"Five Dozen",61:"Bakers Bun",62:"Turn the Screw / tickety-boo",63:"Tickle Me 63",64:"Red Raw",65:"Old Age Pension",66:"Clickety Clicks",67:"Made in Heaven",68:"Saving Grace",69:"Either Way Up",70:"Three Score and Ten",71:"Bang on the Drum",72:"Six Dozen",73:"Queen Bee",74:"Candy Store / hit the floor",75:"Strive and Strive",76:"Trombones",77:"Sunset Strip",78:"Heaven's Gate / 39 more steps",79:"One More Time",80:"Eight and Blank",81:"Stop and Run",82:"Straight On Through",83:"Time for Tea",84:"Seven Dozen",85:"Staying Alive",86:"Between the Sticks",87:"Torquay in Devon",88:"Two Fat Ladies",89:"Nearly There",90:"Top of the Shop"};

/* Themes. lit1-3 colour the called numbers on the board in rotation. */
/* set pieces */
const tree = side => `<svg class="tree ${side}" viewBox="0 0 120 170"><rect x="52" y="150" width="16" height="18" fill="#4a2a14"/><path d="M60 12 L92 62 H78 L104 104 H86 L112 148 H8 L34 104 H16 L42 62 H28Z" fill="#12573a"/><path d="M60 12 L92 62 H78 L104 104 H86 L112 148 H60Z" fill="#0d4a30" opacity=".7"/><polygon points="60,0 64,10 75,10 66,17 69,28 60,21 51,28 54,17 45,10 56,10" fill="#ffd966"/>${[[60,40,"#ff4757"],[46,70,"#ffd166"],[74,84,"#4cc9f0"],[36,114,"#ff4757"],[62,106,"#ffd166"],[88,126,"#ff8fd0"],[50,138,"#4cc9f0"],[78,58,"#ff4757"]].map(([x,y,c],i)=>`<circle class="b" cx="${x}" cy="${y}" r="4.5" fill="${c}" style="animation-delay:${i*.35}s"/>`).join("")}</svg>`;
const bat = (y,dy,d,l) => `<div class="bat" style="--y:${y}%;--dy:${dy}px;--d:${d}s;--l:${l}s"><svg viewBox="0 0 40 18"><path d="M0 9Q8-2 15 7Q20 2 25 7Q32-2 40 9Q30 7 25 15Q20 8 15 15Q10 7 0 9Z" fill="#05020a"/></svg></div>`;
const SC = {
  classic: '<div class="beam"></div><div class="beam r"></div>',
  party: '<div class="spokes"></div><div class="disco"><i></i></div>',
  christmas: tree("l") + tree("r"),
  bonfire: '<svg class="sky" viewBox="0 0 1000 120" preserveAspectRatio="none"><path d="M0 120V78H50V52H84V70H120V36H158V66H196V84H240V48H282V74H330V28H366V62H410V80H456V44H500V70H548V90H590V54H632V30H676V66H720V82H770V46H812V72H860V38H902V64H950V80H1000V120Z" fill="#04050d"/></svg>',
  halloween: '<div class="hmoon"></div>' + bat(14,-30,16,0) + bat(30,-60,22,-8) + bat(8,40,19,-13) +
    '<div class="hills"></div><svg class="dtree" viewBox="0 0 100 160"><path d="M50 160V90M50 112L20 80M50 100L80 62M32 92L24 60M66 80L72 50M20 80L8 70" stroke="#05020a" stroke-width="6" stroke-linecap="round" fill="none"/></svg>',
  casino: ["t","m","l","r"].map(k=>`<i class="mq ${k}"></i><i class="mq ${k} o"></i>`).join("")
};
let fwTimer = null;
function burst(){
  if(document.hidden) return;
  const c = ["#ffcf5c","#ff5d5d","#5dc8ff","#c58bff","#7dffb0"][Math.floor(rnd(0,5))];
  const g = document.createElement("div"); g.className = "burst"; g.style.cssText = `left:${rnd(10,90)}%;top:${rnd(10,55)}%`;
  for(let i=0;i<30;i++){
    const a = i/30*Math.PI*2, r = rnd(50,115), sp = document.createElement("i");
    sp.className = "spark"; sp.style.cssText = `--c:${c};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px`; g.appendChild(sp);
  }
  el.scene.appendChild(g); setTimeout(() => g.remove(), 1700);
}
function buildScene(t){
  clearInterval(fwTimer);
  el.scene.innerHTML = t.scene || "";
  if(t.fireworks){ burst(); fwTimer = setInterval(burst, 1200); }
}

const THEMES = [
  {name:"Classic", overlay:"orbs", scene:SC.classic, vars:{
    "--bg1":"#13233a","--bg2":"#0a1220","--panel":"#16253b","--line":"#2a3d59","--ink":"#e8eef7","--muted":"#7f93ad",
    "--accent":"#5eead4","--accent-ink":"#06201c","--ball":"#3b82c4","--ball2":"#143a66","--face":"#f4f7fb","--face-ink":"#12243d",
    "--lit1":"#2b8f86","--lit2":"#3173b8","--lit3":"#5b5fc4","--lit-hi":"#9be8de"}},
  {name:"Christmas", overlay:"snow+stars", lights:true, scene:SC.christmas, vars:{
    "--bg1":"#174232","--bg2":"#0a1f18","--panel":"rgba(10,31,24,.82)","--line":"rgba(217,180,90,.35)","--ink":"#f6ecd6","--muted":"#b8ae92",
    "--accent":"#e0b955","--accent-ink":"#2a1b00","--ball":"#c52a35","--ball2":"#6c0f18","--face":"#f8efd9","--face-ink":"#7a1119",
    "--lit1":"#c52a35","--lit2":"#237a52","--lit3":"#d4a93f","--lit-hi":"#ffd9d4"}},
  {name:"Snowy night", overlay:"snow", vars:{
    "--bg1":"#16305c","--bg2":"#05080f","--panel":"rgba(12,18,38,.85)","--line":"#34476e","--ink":"#e6f0ff","--muted":"#8ea3c7",
    "--accent":"#cfe3ff","--accent-ink":"#0d2347","--ball":"#8fb4e8","--ball2":"#2c4a80","--face":"#ffffff","--face-ink":"#1a2f55",
    "--lit1":"#5b8fd6","--lit2":"#8aa7e0","--lit3":"#a9c4ee","--lit-hi":"#ffffff"}},
  {name:"Firefly meadow", overlay:"fireflies", vars:{
    "--bg1":"#0f3a2a","--bg2":"#04120d","--panel":"rgba(5,25,17,.85)","--line":"#25503b","--ink":"#e6f4e8","--muted":"#8fb09a",
    "--accent":"#c6d84a","--accent-ink":"#1f2a05","--ball":"#4f9a45","--ball2":"#1b4a22","--face":"#f4f7e8","--face-ink":"#1d3a1a",
    "--lit1":"#5f9f3a","--lit2":"#3f8a5a","--lit3":"#8aa82e","--lit-hi":"#e3f2a0"}},
  {name:"Party", overlay:"confetti+balloons", scene:SC.party, vars:{
    "--bg1":"#4a1d6e","--bg2":"#1a0a2a","--panel":"rgba(26,10,42,.85)","--line":"#5d3a80","--ink":"#fdf0e0","--muted":"#bba0cf",
    "--accent":"#ffc857","--accent-ink":"#3a1d00","--ball":"#e0527a","--ball2":"#7d1f4a","--face":"#fff6e6","--face-ink":"#4a1d6e",
    "--lit1":"#e0527a","--lit2":"#f08a3c","--lit3":"#8a5bd6","--lit-hi":"#ffe0b8"}},
  {name:"Synthwave", overlay:"none", vars:{
    "--ink":"#fbe9ff","--muted":"#b79ad0","--line":"#5a2a7a","--bg2":"#12001f",
    "--accent":"#ff4fd8","--accent-ink":"#1a0030","--lit1":"#ff2a6d","--lit2":"#00e5ff","--lit3":"#a56bff","--lit-hi":"#ffffff"}},
  {name:"Deep ocean", overlay:"orbs", vars:{
    "--ink":"#e3f8ff","--muted":"#8dc3d4","--line":"#1f6b80","--bg2":"#00141f",
    "--accent":"#7fe6ff","--accent-ink":"#00222e","--lit1":"#1fb5c9","--lit2":"#3d8bd9","--lit3":"#5ad6b0","--lit-hi":"#ffffff"}},
  {name:"Bonfire night", overlay:"stars", fireworks:true, scene:SC.bonfire, vars:{
    "--ink":"#eef0ff","--muted":"#8b93c4","--line":"#2c3470","--bg2":"#02030a",
    "--accent":"#ffcf5c","--accent-ink":"#2a1d00","--lit1":"#ff5d5d","--lit2":"#e6a817","--lit3":"#3f9bd9","--lit-hi":"#ffe9c0"}},
  {name:"Halloween", overlay:"stars", scene:SC.halloween, vars:{
    "--ink":"#f6e9d6","--muted":"#b79ac8","--line":"#5a2a6a","--bg2":"#0a0410",
    "--accent":"#ff8a1f","--accent-ink":"#2a1200","--lit1":"#ff7a00","--lit2":"#8f3bd6","--lit3":"#6cc83a","--lit-hi":"#ffe2bd"}},
  {name:"Casino", overlay:"none", scene:SC.casino, vars:{
    "--ink":"#fff3dc","--muted":"#c9a98a","--line":"#6b2a2a","--bg2":"#14020a",
    "--accent":"#ffd86b","--accent-ink":"#3a2400","--lit1":"#d62839","--lit2":"#e6b422","--lit3":"#1f9d6b","--lit-hi":"#ffffff"}}
];


/* original-style extras per theme */
const EXTRA = {
  "Classic":{"--bg-gradient":"linear-gradient(-45deg,#1a237e,#0d47a1,#64ffda,#00bcd4)","--sec":"#00bcd4","--panel":"rgba(0,0,0,.35)","--bubble":"rgba(0,0,0,.7)","--ink":"#e0e0e0"},
  "Christmas":{"--bg-gradient":"linear-gradient(160deg,#0b3d2a,#14532d,#6b1420,#0a1f18)","--sec":"#c52a35","--panel":"rgba(8,28,20,.85)","--bubble":"rgba(0,0,0,.75)"},
  "Snowy night":{"--bg-gradient":"linear-gradient(160deg,#0d47a1,#1a237e,#000)","--accent":"#fff","--sec":"#bbdefb","--panel":"rgba(15,15,40,.85)","--bubble":"rgba(0,0,0,.8)"},
  "Firefly meadow":{"--bg-gradient":"linear-gradient(150deg,#001a00,#003300,#004d40)","--sec":"#aeea00","--panel":"rgba(0,20,0,.85)","--bubble":"rgba(0,0,0,.8)"},
  "Synthwave":{"--bg-gradient":"linear-gradient(180deg,#12001f,#3d0a63 55%,#b3124f)","--sec":"#00e5ff","--panel":"rgba(18,0,31,.8)","--bubble":"rgba(10,0,20,.85)"},
  "Deep ocean":{"--bg-gradient":"linear-gradient(180deg,#0a6a85,#02364d 50%,#00141f)","--sec":"#2aa7c9","--panel":"rgba(0,20,31,.8)","--bubble":"rgba(0,10,18,.8)"},
  "Bonfire night":{"--bg-gradient":"linear-gradient(180deg,#02030f,#0b1233 65%,#1c1a3c)","--sec":"#ff5d5d","--panel":"rgba(3,5,20,.8)","--bubble":"rgba(0,0,10,.8)"},
  "Halloween":{"--bg-gradient":"linear-gradient(180deg,#0a0410,#2b0a42 60%,#4a1230)","--sec":"#8f3bd6","--panel":"rgba(10,4,16,.82)","--bubble":"rgba(5,0,10,.85)"},
  "Casino":{"--bg-gradient":"radial-gradient(ellipse at 50% 30%,#5a0a1c,#2a0610 60%,#14020a)","--sec":"#d62839","--panel":"rgba(20,2,10,.82)","--bubble":"rgba(10,0,5,.85)"},
  "Party":{"--bg-gradient":"linear-gradient(135deg,#4a148c,#ff6f00,#d500f9)","--sec":"#ff8a65","--panel":"rgba(0,0,0,.75)","--bubble":"rgba(0,0,0,.85)"}
};
const $ = id => document.getElementById(id);
const el = {number:$("number"),ball:$("ball"),board:$("board"),recent:$("recent"),count:$("count"),draw:$("draw"),
  undo:$("undo"),reset:$("reset"),big:$("bigbtn"),theme:$("theme"),say:$("say"),sayText:$("say-text"),
  optSay:$("opt-say"),optSpeak:$("opt-speak"),msg:$("msg"),overlay:$("overlay"),scene:$("scene"),lights:$("lights")};

let history = [], remaining = [], themeIndex = 0, showSay = false, speak = false, bigWin = null;

/* ---------- storage ---------- */
function validNums(a){
  return Array.isArray(a) && a.every(n => Number.isInteger(n) && n >= 1 && n <= TOTAL) && new Set(a).size === a.length;
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(!s || !validNums(s.history)) return null;
    return s;
  }catch(e){ return null; }
}
function save(){
  if(IS_DISPLAY) return; // the big-screen window only reads
  try{
    localStorage.setItem(KEY, JSON.stringify({history, remaining, currentThemeIndex:themeIndex, callerPromptEnabled:showSay, speak}));
  }catch(e){ console.warn("Could not save game", e); }
}
function applyState(s){
  history = s.history.slice();
  // always rebuild "remaining" from history so the two can never disagree
  remaining = Array.from({length:TOTAL},(_,i)=>i+1).filter(n=>!history.includes(n));
  themeIndex = THEMES[s.currentThemeIndex] ? s.currentThemeIndex : 0;
  showSay = !!s.callerPromptEnabled;
  speak = !!s.speak;
}

/* ---------- theme ---------- */
function rnd(a,b){ return a + Math.random()*(b-a); }
function buildOverlay(t){
  el.overlay.innerHTML = "";
  const frag = document.createDocumentFragment();
  const add = (cls,n,fn) => { for(let i=0;i<n;i++){ const d=document.createElement("div"); d.className=cls; fn(d); frag.appendChild(d);} };
  const has = k => t.overlay.split("+").includes(k);
  if(has("orbs")) add("orb", 22, d=>{ const z=rnd(8,34);
    d.style.cssText = `left:${rnd(0,100)}%;width:${z}px;height:${z}px;animation-duration:${rnd(10,22)}s;animation-delay:${-rnd(0,22)}s;--dx:${rnd(-40,40)}px`; });
  if(has("balloons")) add("balloon", 9, d=>{
    d.style.cssText = `left:${rnd(2,96)}%;background:radial-gradient(circle at 32% 28%,#fff8,${["#ff4d6d","#ffd166","#4cc9f0","#b388ff"][Math.floor(rnd(0,4))]} 55%);animation-duration:${rnd(14,26)}s;animation-delay:${-rnd(0,26)}s;--dx:${rnd(-30,30)}px`; });
  if(has("stars")) add("star", 70, d=>{
    d.style.cssText = `left:${rnd(0,100)}%;top:${rnd(0,70)}%;animation-duration:${rnd(2,5)}s;animation-delay:${-rnd(0,5)}s`; });
  if(has("snow")) add("flake", t.lights ? 110 : 80, d=>{
    const s = rnd(2,6); d.style.cssText = `left:${rnd(0,100)}%;width:${s}px;height:${s}px;opacity:${rnd(.4,.95)};` +
      `animation-duration:${rnd(9,20)}s;animation-delay:${-rnd(0,20)}s;--dx:${rnd(-60,60)}px;filter:blur(${s>4?1:0}px)`;
  });
  if(has("fireflies")) add("fly", 26, d=>{
    d.style.cssText = `left:${rnd(0,100)}%;top:${rnd(0,100)}%;animation-duration:${rnd(4,9)}s;animation-delay:${-rnd(0,6)}s`;
  });
  if(has("confetti")) add("conf", 50, d=>{
    d.style.cssText = `left:${rnd(0,100)}%;background:${["#ff4d6d","#ffd166","#4cc9f0","#f8961e","#b388ff"][Math.floor(rnd(0,5))]};` +
      `animation-duration:${rnd(6,12)}s;animation-delay:${-rnd(0,12)}s;--dx:${rnd(-80,80)}px`;
  });
  el.overlay.appendChild(frag);
}
function buildLights(){
  const W = 1000, n = 30, cols = ["#ff3b4a","#ffd166","#3ddc84","#4cc9f0","#ff8fd0"];
  const y = i => 12 + 14*Math.abs(Math.sin(i/n*Math.PI*5));
  let path = "M0,6", bulbs = "";
  for(let i=0;i<=n;i++) path += ` L${(i/n*W).toFixed(1)},${y(i).toFixed(1)}`;
  for(let i=0;i<n;i++){
    const c = cols[i%cols.length], x = (i+.5)/n*100;
    bulbs += `<span class="bulb" style="left:${x}%;top:${y(i+.5)+4}px;background:${c};box-shadow:0 0 14px ${c};animation-delay:${(i%5)*.45}s"></span>`;
  }
  el.lights.innerHTML = `<svg viewBox="0 0 ${W} 40" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#1d1d1d" stroke-width="2"/></svg>${bulbs}`;
}
function setTheme(i){
  themeIndex = i; const t = THEMES[i];
  const v = Object.assign({}, t.vars, EXTRA[t.name]);
  for(const k in v) document.documentElement.style.setProperty(k, v[k]);
  document.body.dataset.theme = t.name.toLowerCase().replace(/\s+/g,"-");
  buildOverlay(t); buildScene(t);
  el.theme.value = String(i);
  save();
}

/* ---------- render ---------- */
function buildBoard(){
  for(let n=1;n<=TOTAL;n++){
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+n; c.textContent = n;
    el.board.appendChild(c);
  }
}
function phrase(n){
  return CALLS[n] ? `${CALLS[n]} – number ${n}` : `Number ${n}`;
}
function render(animate){
  const last = history[history.length-1];
  el.number.textContent = last ?? "–";
  if(animate){ el.ball.classList.remove("pop"); void el.ball.offsetWidth; el.ball.classList.add("pop"); }

  for(let n=1;n<=TOTAL;n++){
    const c = $("cell-"+n);
    c.classList.toggle("on", history.includes(n));
    c.classList.toggle("latest", n === last);
  }
  el.recent.innerHTML = "";
  history.slice(-6,-1).reverse().forEach(n => {
    const s = document.createElement("span"); s.textContent = n; el.recent.appendChild(s);
  });
  el.count.textContent = history.length ? `${history.length} of ${TOTAL} called` : "No numbers called yet";
  el.say.classList.toggle("on", showSay && !IS_DISPLAY);
  el.sayText.textContent = last ? phrase(last) : "Waiting for the first number";
  el.draw.disabled = remaining.length === 0;
  el.draw.textContent = remaining.length ? "Next number" : "All 90 called";
  el.undo.disabled = history.length === 0;
  el.optSay.checked = showSay; el.optSpeak.checked = speak;
}

/* ---------- actions ---------- */
function say(n){
  if(!speak || !("speechSynthesis" in window)) return;
  const digits = n > 9 ? String(n).split("").join(" ") + ", " : "";
  const u = new SpeechSynthesisUtterance(`${CALLS[n] ? CALLS[n].split(" / ")[0] + ". " : ""}${digits}${n}`);
  u.lang = "en-GB"; u.rate = .9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function drawNumber(){
  if(!remaining.length){ el.msg.textContent = "All 90 numbers have been called. Time to check the cards."; return; }
  const n = remaining.splice(Math.floor(Math.random()*remaining.length),1)[0];
  history.push(n);
  el.msg.textContent = "";
  save(); render(true); say(n);
}
function undoLast(){
  if(!history.length) return;
  remaining.push(history.pop());
  el.msg.textContent = "Last number put back in the pool.";
  save(); render(false);
}
function newGame(){
  if(history.length && !confirm("Start a new game? The numbers called so far will be cleared.")) return;
  history = []; remaining = Array.from({length:TOTAL},(_,i)=>i+1);
  el.msg.textContent = ""; speechSynthesis && speechSynthesis.cancel();
  save(); render(false);
}
function openBigScreen(){
  if(bigWin && !bigWin.closed){ bigWin.focus(); return; }
  bigWin = window.open(location.href.split("#")[0] + "#display", "bingo_display", "width=1200,height=720");
  if(!bigWin) el.msg.textContent = "The big-screen window was blocked. Allow pop-ups for this page and try again.";
}

/* Console helpers kept from the original */
window.enableCallerPrompt  = () => { showSay = true;  save(); render(false); };
window.disableCallerPrompt = () => { showSay = false; save(); render(false); };

/* ---------- init ---------- */
THEMES.forEach((t,i) => { const o = document.createElement("option"); o.value = i; o.textContent = t.name; el.theme.appendChild(o); });
buildBoard(); buildLights();

const saved = load();
if(saved) applyState(saved); else { remaining = Array.from({length:TOTAL},(_,i)=>i+1); }
setTheme(themeIndex);
render(false);

if(IS_DISPLAY){
  document.body.classList.add("display");
  document.title = "Bingo – big screen";
  // follow the main window through localStorage
  window.addEventListener("storage", e => {
    if(e.key !== KEY) return;
    const s = load(); if(!s) return;
    const before = history.length, lastBefore = history[before-1];
    applyState(s);
    if(THEMES[themeIndex] && document.body.dataset.theme !== THEMES[themeIndex].name.toLowerCase().replace(/\s+/g,"-")) setTheme(themeIndex);
    render(history[history.length-1] !== lastBefore && history.length > 0);
  });
}else{
  el.draw.onclick = drawNumber; el.undo.onclick = undoLast; el.reset.onclick = newGame; el.big.onclick = openBigScreen;
  el.theme.onchange = () => setTheme(parseInt(el.theme.value,10) || 0);
  el.optSay.onchange = () => { showSay = el.optSay.checked; save(); render(false); };
  el.optSpeak.onchange = () => { speak = el.optSpeak.checked; save(); };
  document.addEventListener("keydown", e => {
    if(e.target.closest("select,input,button") || e.ctrlKey || e.metaKey) return;
    if(e.code === "Space"){ e.preventDefault(); drawNumber(); }
    else if(e.key.toLowerCase() === "u") undoLast();
  });
}
</script>
</body>
